<!DOCTYPE html>
<!-- @dsCard group="Components" name="Inputs" subtitle="Search field · text field · checkbox · progress bar · skeleton" viewport="420x560" -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Inputs — Nyan Read</title>
  <link rel="stylesheet" href="../../colors_and_type.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <style>html, body { margin: 0; } body { padding: 20px; background: var(--nyan-bg); }</style>
</head>
<body>
<div id="root"></div>
<script src="../../_ds_bundle.js"></script>
<script>
(function () {
  var NS = window[Object.keys(window).filter(function (k) { return k.indexOf("NyanReadDesignSystem_") === 0; })[0]];
  var h = React.createElement;
  function Demo() {
    var q = React.useState("Stillwater");
    var note = React.useState("");
    var c1 = React.useState(true), c2 = React.useState(false);
    return h("div", { style: { display: "flex", flexDirection: "column", gap: 18 } },
      h(NS.SearchField, { value: q[0], onChange: q[1] }),
      h(NS.TextField, { label: "Rename book", value: note[0], onChange: note[1], icon: "title", placeholder: "Book title" }),
      h(NS.TextField, { label: "Note", multiline: true, rows: 2, value: "", placeholder: "Write a note…" }),
      h("div", { style: { display: "flex", flexDirection: "column", gap: 10 } },
        h("label", { style: { display: "flex", alignItems: "center", gap: 4, font: "500 14px/1 var(--font-ui)", color: "var(--nyan-text)" } },
          h(NS.Checkbox, { checked: c1[0], onChange: c1[1] }), "Public Shelf"),
        h("label", { style: { display: "flex", alignItems: "center", gap: 4, font: "500 14px/1 var(--font-ui)", color: "var(--nyan-text)" } },
          h(NS.Checkbox, { checked: c2[0], onChange: c2[1] }), "Require PIN")),
      h("div", { style: { display: "flex", flexDirection: "column", gap: 10 } },
        h(NS.ProgressBar, { value: 0.42, label: true }),
        h(NS.ProgressBar, { value: 0.88, height: 6 })),
      h("div", { style: { display: "flex", gap: 12, alignItems: "center" } },
        h(NS.Skeleton, { variant: "cover", width: 60 }),
        h("div", { style: { flex: 1, display: "flex", flexDirection: "column", gap: 8 } },
          h(NS.Skeleton, { variant: "text", width: "80%" }),
          h(NS.Skeleton, { variant: "text", width: "55%" }),
          h(NS.Skeleton, { variant: "text", width: "40%", height: 10 }))));
  }
  ReactDOM.createRoot(document.getElementById("root")).render(h(Demo));
})();
</script>
</body>
</html>
