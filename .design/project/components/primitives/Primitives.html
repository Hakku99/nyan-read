<!DOCTYPE html>
<!-- @dsCard group="Components" name="Primitives" subtitle="Buttons · pill chips · switch · segmented · slider · icons" viewport="420x430" -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Primitives — Nyan Read</title>
  <link rel="stylesheet" href="../../colors_and_type.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <style>html, body { margin: 0; } body { padding: 20px; background: var(--nyan-bg); }</style>
</head>
<body>
<div id="root"></div>
<script src="../../_ds_bundle.js"></script>
<script>
(function () {
  var NS = window[Object.keys(window).filter(function (k) { return k.indexOf("NyanReadDesignSystem_") === 0; })[0]];
  var h = React.createElement;
  function Demo() {
    var on = React.useState(true), tab = React.useState(0), v = React.useState(62), pill = React.useState(1);
    return h("div", { style: { display: "flex", flexDirection: "column", gap: 18 } },
      h("div", { style: { display: "flex", gap: 10, flexWrap: "wrap" } },
        h(NS.NyanPrimaryButton, { label: "Continue Reading", icon: "menu_book" }),
        h(NS.NyanPrimaryButton, { label: "Not now", variant: "ghost" })),
      h("div", { style: { display: "flex", gap: 8 } }, ["Low", "Medium", "High"].map(function (l, i) {
        return h(NS.PillButton, { key: l, label: l, selected: pill[0] === i, onPress: function () { pill[1](i); }, style: { flex: 1 } });
      })),
      h(NS.SegmentedTabControl, { tabs: [{ label: "Display" }, { label: "Text" }, { label: "Theme" }], selected: tab[0], onChange: tab[1] }),
      h("div", { style: { display: "flex", alignItems: "center", gap: 16 } },
        h(NS.NyanSwitch, { value: on[0], onChange: on[1] }),
        h("div", { style: { flex: 1 } }, h(NS.NyanSlider, { value: v[0], onChange: v[1] }))),
      h("div", { style: { display: "flex", gap: 16 } }, ["menu_book", "bookmark", "search", "settings", "highlighter", "sort"].map(function (n) {
        return h(NS.Icon, { key: n, name: n, size: 22 });
      }))
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(h(Demo));
})();
</script>
</body>
</html>
