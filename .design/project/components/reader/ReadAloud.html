<!DOCTYPE html>
<!-- @dsCard group="Components" name="Read Aloud (TTS)" subtitle="TTSPlayer transport inside a One Paper sheet" viewport="420x420" -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Read Aloud — Nyan Read</title>
  <link rel="stylesheet" href="../../colors_and_type.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <style>html, body { margin: 0; } body { background: var(--nyan-bg); }</style>
</head>
<body>
<div id="root"></div>
<script src="../../_ds_bundle.js"></script>
<script>
(function () {
  var NS = window[Object.keys(window).filter(function (k) { return k.indexOf("NyanReadDesignSystem_") === 0; })[0]];
  var h = React.createElement;
  function Demo() {
    var playing = React.useState(true), prog = React.useState(0.3), speed = React.useState(1);
    return h("div", { style: { position: "relative", height: 420, background: "var(--reader-bg-cream)" } },
      h("div", { style: { position: "absolute", left: 12, right: 12, bottom: 12, background: "var(--nyan-surface)", border: "1px solid var(--chrome-edge)", borderRadius: "var(--r-sheet)", boxShadow: "var(--shadow-light-card)", overflow: "hidden" } },
        h("div", { style: { paddingTop: 10, display: "flex", justifyContent: "center" } },
          h("div", { style: { width: 40, height: 5, borderRadius: 999, background: "var(--grabber)" } })),
        h(NS.TTSPlayer, {
          chapter: "Chapter 3 — A Cup of Still Water",
          playing: playing[0], onTogglePlay: function () { playing[1](!playing[0]); },
          progress: prog[0], onSeek: prog[1], elapsed: "2:14", remaining: "7:30",
          speedIndex: speed[0], onSpeed: speed[1]
        })));
  }
  ReactDOM.createRoot(document.getElementById("root")).render(h(Demo));
})();
</script>
</body>
</html>
