<!DOCTYPE html>
<!-- @dsCard group="Components" name="Privacy PIN" subtitle="PinOverlay — the full-screen privacy-shelf gate (U16)" viewport="420x620" -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Privacy PIN — Nyan Read</title>
  <link rel="stylesheet" href="../../colors_and_type.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <style>html, body { margin: 0; } body { background: var(--nyan-bg); }
    @keyframes pin-shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-8px)} 40%,80%{transform:translateX(8px)} }
  </style>
</head>
<body>
<div id="root"></div>
<script src="../../_ds_bundle.js"></script>
<script>
(function () {
  // Canonical U16 privacy-shelf gate. PinOverlay is published onto window by the
  // compiled bundle, so this card always renders the exact same component U16 does.
  var PinOverlay = window.PinOverlay;
  var h = React.createElement;
  ReactDOM.createRoot(document.getElementById("root")).render(
    h("div", { style: { width: 390, height: 620, borderRadius: 26, overflow: "hidden", background: "var(--nyan-bg)" } },
      h(PinOverlay, { mode: "verify", hasError: false, dark: true })));
})();
</script>
</body>
</html>
