<!DOCTYPE html>
<!-- @dsCard group="Components" name="Dialog" subtitle="Centered confirm / alert — default + danger" viewport="420x520" -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dialog — Nyan Read</title>
  <link rel="stylesheet" href="../../colors_and_type.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <style>html, body { margin: 0; } body { background: var(--nyan-bg); }</style>
</head>
<body>
<div id="root"></div>
<script src="../../_ds_bundle.js"></script>
<script>
(function () {
  var NS = window[Object.keys(window).filter(function (k) { return k.indexOf("NyanReadDesignSystem_") === 0; })[0]];
  var h = React.createElement;
  function Demo() {
    var which = React.useState("danger"); // 'danger' | 'default' | null
    return h("div", { style: { position: "relative", height: 520, background: "var(--reader-bg-cream)" } },
      h("div", { style: { padding: 20, display: "flex", gap: 10 } },
        h(NS.NyanPrimaryButton, { label: "Delete book", variant: "ghost", onPress: function () { which[1]("danger"); } }),
        h(NS.NyanPrimaryButton, { label: "Leave page", variant: "ghost", onPress: function () { which[1]("default"); } })),
      h(NS.NyanDialog, {
        open: which[0] === "danger", tone: "danger", icon: "delete",
        title: "Delete this book?", message: "“The Stillwater Diaries” and its 3 bookmarks will be removed from this device.",
        confirmLabel: "Delete", onClose: function () { which[1](null); }, onConfirm: function () { which[1](null); }
      }),
      h(NS.NyanDialog, {
        open: which[0] === "default", icon: "auto_stories",
        title: "Leave without saving?", message: "Your place in the chapter is kept, but the note you started will be discarded.",
        confirmLabel: "Leave", cancelLabel: "Keep editing", onClose: function () { which[1](null); }, onConfirm: function () { which[1](null); }
      }));
  }
  ReactDOM.createRoot(document.getElementById("root")).render(h(Demo));
})();
</script>
</body>
</html>
