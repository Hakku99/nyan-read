<!DOCTYPE html>
<!-- @dsCard group="Components" name="Surfaces" subtitle="Grouped rows · info card · response toast" viewport="420x470" -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Surfaces — Nyan Read</title>
  <link rel="stylesheet" href="../../colors_and_type.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <style>html, body { margin: 0; } body { padding: 20px; background: var(--nyan-bg); }</style>
</head>
<body>
<div id="root"></div>
<script src="../../_ds_bundle.js"></script>
<script>
(function () {
  var NS = window[Object.keys(window).filter(function (k) { return k.indexOf("NyanReadDesignSystem_") === 0; })[0]];
  var h = React.createElement;
  ReactDOM.createRoot(document.getElementById("root")).render(
    h("div", { style: { display: "flex", flexDirection: "column", gap: 16 } },
      h(NS.NyanRowGroup, null,
        h(NS.NyanListRow, { icon: "palette", title: "Reading Appearance", subtitle: "Cream · 18pt serif", onPress: function () {} }),
        h(NS.NyanListRow, { icon: "lock", title: "Privacy Shelf", subtitle: "PIN required", onPress: function () {} }),
        h(NS.NyanListRow, { icon: "delete", title: "Clear Reading Data", danger: true, onPress: function () {} })),
      h(NS.NyanInfoCard, null,
        h("div", { style: { font: "600 16px/1.3 var(--font-ui)", color: "var(--nyan-text)" } }, "Quiet paper card"),
        h("div", { className: "nyan-meta", style: { marginTop: 4 } }, "NyanInfoCard · standard variant")),
      h(NS.NyanResponse, { status: "success", title: "Bookmark deleted", description: "Chapter 3 · 42%", action: { label: "Undo" } })
    )
  );
})();
</script>
</body>
</html>
