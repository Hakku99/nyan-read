<!doctype html>
<!-- @dsCard group="Brand" name="Components — Empty state" subtitle="Centered icon-wash + warm title + import CTA" viewport="700x270" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Empty state</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<style>
  html, body { margin: 0; padding: 0; }
  body { background: var(--nyan-bg); padding: 24px; }
  .card { width: 100%; }
  .row { display: flex; gap: 12px; align-items: center; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .swatch { width: 56px; height: 56px; border-radius: var(--radius-small); border: 1px solid color-mix(in srgb, var(--nyan-divider) 60%, transparent); }
  .swatch-lg { width: 100%; height: 64px; border-radius: var(--radius-card); border: 1px solid color-mix(in srgb, var(--nyan-divider) 60%, transparent); }
  .token-label { font: var(--fw-medium) var(--fz-meta)/1.2 var(--font-ui); color: var(--nyan-text); }
  .token-meta  { font: var(--fw-regular) 11px/1.3 var(--font-mono); color: var(--nyan-text-secondary); }
  .grid { display: grid; gap: 14px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font: var(--fw-medium) 11px/1 var(--font-mono); background: var(--nyan-surface-muted); color: var(--nyan-text-secondary); border: 1px solid var(--nyan-divider); }
  
</style>
</head>
<body><div class="card">
  <div class="col" style="gap:14px; align-items:center; text-align:center; padding:24px 16px;">
    <div style="padding:14px; background:color-mix(in srgb, var(--nyan-primary) 8%, transparent); border-radius:var(--radius-card);">
      <i class="ph ph-books" style="font-size:34px; color:color-mix(in srgb, var(--nyan-primary) 80%, transparent);"></i>
    </div>
    <div class="col" style="gap:8px; max-width: 360px;">
      <div style="font:600 20px/1.3 var(--font-ui); color:var(--nyan-text);">Bookshelf is waiting for stories</div>
      <div style="font:400 14px/1.5 var(--font-ui); color:var(--nyan-text-secondary);">Import a book to start reading</div>
    </div>
    <button style="all:unset; cursor:pointer; margin-top:6px; min-height:44px; padding:12px 24px; background:var(--nyan-primary); color:var(--nyan-surface); font:500 16px/1 var(--font-ui); border-radius:var(--radius-input);">Import Files</button>
  </div>
</div></body>
</html>
