<!doctype html>
<!-- @dsCard group="Brand" name="Colors — Highlight pens" subtitle="Fixed 5-pastel palette, identical across themes" viewport="700x220" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Highlight pens</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<style>
  html, body { margin: 0; padding: 0; }
  body { background: var(--nyan-bg); padding: 24px; }
  .card { width: 100%; }
  .row { display: flex; gap: 12px; align-items: center; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .swatch { width: 56px; height: 56px; border-radius: var(--radius-small); border: 1px solid color-mix(in srgb, var(--nyan-divider) 60%, transparent); }
  .swatch-lg { width: 100%; height: 64px; border-radius: var(--radius-card); border: 1px solid color-mix(in srgb, var(--nyan-divider) 60%, transparent); }
  .token-label { font: var(--fw-medium) var(--fz-meta)/1.2 var(--font-ui); color: var(--nyan-text); }
  .token-meta  { font: var(--fw-regular) 11px/1.3 var(--font-mono); color: var(--nyan-text-secondary); }
  .grid { display: grid; gap: 14px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font: var(--fw-medium) 11px/1 var(--font-mono); background: var(--nyan-surface-muted); color: var(--nyan-text-secondary); border: 1px solid var(--nyan-divider); }
  
</style>
</head>
<body><div class="card">
  <div class="col" style="gap:14px;">
    <div style="font:500 13px/1.3 var(--font-ui); color:var(--nyan-text-secondary); letter-spacing:0.22px;">FIXED PALETTE — same in cream + sumi</div>
    <div class="grid" style="grid-template-columns: repeat(5, 1fr);">
      <div class="col" style="gap:6px; align-items:center;"><div class="swatch" style="background:#F2E58A; width:100%; height:48px;"></div><div class="token-meta">yellow<br/>F2E58A</div></div>
      <div class="col" style="gap:6px; align-items:center;"><div class="swatch" style="background:#A8D18D; width:100%; height:48px;"></div><div class="token-meta">green<br/>A8D18D</div></div>
      <div class="col" style="gap:6px; align-items:center;"><div class="swatch" style="background:#9EC5E8; width:100%; height:48px;"></div><div class="token-meta">blue<br/>9EC5E8</div></div>
      <div class="col" style="gap:6px; align-items:center;"><div class="swatch" style="background:#E8A0BF; width:100%; height:48px;"></div><div class="token-meta">pink<br/>E8A0BF</div></div>
      <div class="col" style="gap:6px; align-items:center;"><div class="swatch" style="background:#F2BE7E; width:100%; height:48px;"></div><div class="token-meta">orange<br/>F2BE7E*</div></div>
    </div>
    <div style="font:400 12px/1.4 var(--font-ui); color:var(--nyan-text-secondary);">* orange doubles as warmth-slider track and warning state</div>
  </div>
</div></body>
</html>
