<!doctype html>
<!-- @dsCard group="Brand" name="Components — Section header" subtitle="Olive mini-caption + optional dot prefix" viewport="700x230" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Section header (olive + dot)</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<style>
  html, body { margin: 0; padding: 0; }
  body { background: var(--nyan-bg); padding: 24px; }
  .card { width: 100%; }
  .row { display: flex; gap: 12px; align-items: center; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .swatch { width: 56px; height: 56px; border-radius: var(--radius-small); border: 1px solid color-mix(in srgb, var(--nyan-divider) 60%, transparent); }
  .swatch-lg { width: 100%; height: 64px; border-radius: var(--radius-card); border: 1px solid color-mix(in srgb, var(--nyan-divider) 60%, transparent); }
  .token-label { font: var(--fw-medium) var(--fz-meta)/1.2 var(--font-ui); color: var(--nyan-text); }
  .token-meta  { font: var(--fw-regular) 11px/1.3 var(--font-mono); color: var(--nyan-text-secondary); }
  .grid { display: grid; gap: 14px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font: var(--fw-medium) 11px/1 var(--font-mono); background: var(--nyan-surface-muted); color: var(--nyan-text-secondary); border: 1px solid var(--nyan-divider); }
  
</style>
</head>
<body><div class="card">
  <div class="col" style="gap:12px;">
    <div class="row" style="gap:8px; align-items:center;">
      <div style="width:4px; height:4px; background:color-mix(in srgb, var(--nyan-primary) 63%, transparent); border-radius:50%;"></div>
      <div class="nyan-section-header">OVERVIEW</div>
    </div>
    <div style="background:var(--nyan-surface); border-radius:var(--radius-input); border:0.72px solid color-mix(in srgb, var(--nyan-divider) 16%, transparent); padding:14px 16px; box-shadow: var(--shadow-grouped);">
      <div style="font:600 16px/1.3 var(--font-ui); color:var(--nyan-text);">Title</div>
      <div style="font:400 13px/1.3 var(--font-ui); color:var(--nyan-text-secondary); margin-top:2px;">The Tale of Genji</div>
    </div>
    <div style="background:var(--nyan-surface); border-radius:var(--radius-input); border:0.72px solid color-mix(in srgb, var(--nyan-divider) 16%, transparent); padding:14px 16px; box-shadow: var(--shadow-grouped);">
      <div style="font:600 16px/1.3 var(--font-ui); color:var(--nyan-text);">Author</div>
      <div style="font:400 13px/1.3 var(--font-ui); color:var(--nyan-text-secondary); margin-top:2px;">Murasaki Shikibu</div>
    </div>
    <div class="token-meta">Letter-spacing 0.22, weight 600, color = primary @ 90%. Dot is the Book Details variant.</div>
  </div>
</div></body>
</html>
