<!doctype html>
<!-- @dsCard group="Brand" name="Spacing — shadows" subtitle="Three recipes only · all ≤12px blur, ≤5% alpha" viewport="700x220" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Shadow recipes</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<style>
  html, body { margin: 0; padding: 0; }
  body { background: var(--nyan-bg); padding: 24px; }
  .card { width: 100%; }
  .row { display: flex; gap: 12px; align-items: center; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .swatch { width: 56px; height: 56px; border-radius: var(--radius-small); border: 1px solid color-mix(in srgb, var(--nyan-divider) 60%, transparent); }
  .swatch-lg { width: 100%; height: 64px; border-radius: var(--radius-card); border: 1px solid color-mix(in srgb, var(--nyan-divider) 60%, transparent); }
  .token-label { font: var(--fw-medium) var(--fz-meta)/1.2 var(--font-ui); color: var(--nyan-text); }
  .token-meta  { font: var(--fw-regular) 11px/1.3 var(--font-mono); color: var(--nyan-text-secondary); }
  .grid { display: grid; gap: 14px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font: var(--fw-medium) 11px/1 var(--font-mono); background: var(--nyan-surface-muted); color: var(--nyan-text-secondary); border: 1px solid var(--nyan-divider); }
  
</style>
</head>
<body><div class="card">
  <div class="grid" style="grid-template-columns: 1fr 1fr 1fr; gap:14px;">
    <div class="col" style="gap:8px; align-items:center;">
      <div style="width:100%; height:64px; background:var(--nyan-surface); border-radius:var(--radius-card); border:1px solid var(--nyan-divider); box-shadow: var(--shadow-light-card);"></div>
      <div class="token-label" style="text-align:center;">lightCard</div>
      <div class="token-meta" style="text-align:center;">12px @ 4% + 6px @ 2%</div>
    </div>
    <div class="col" style="gap:8px; align-items:center;">
      <div style="width:100%; height:64px; background:var(--nyan-surface); border-radius:var(--radius-card); border:1px solid var(--nyan-divider); box-shadow: var(--shadow-subtle);"></div>
      <div class="token-label" style="text-align:center;">subtle</div>
      <div class="token-meta" style="text-align:center;">8px @ 5%</div>
    </div>
    <div class="col" style="gap:8px; align-items:center;">
      <div style="width:100%; height:64px; background:var(--nyan-surface); border-radius:var(--radius-input); border:1px solid var(--nyan-divider); box-shadow: var(--shadow-grouped);"></div>
      <div class="token-label" style="text-align:center;">settingsGrouped</div>
      <div class="token-meta" style="text-align:center;">10px @ 1.4%</div>
    </div>
  </div>
  <div style="font:400 12px/1.4 var(--font-ui); color:var(--nyan-text-secondary); margin-top:14px;">Sumi Dark: <strong style="color:var(--nyan-text);">no shadows.</strong> Cards in dark mode separate by tonal contrast only.</div>
</div></body>
</html>
