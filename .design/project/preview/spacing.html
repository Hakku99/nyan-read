<!doctype html>
<!-- @dsCard group="Brand" name="Spacing — scale" subtitle="8-pt grid + 4/12/20 · 44px minTapTarget" viewport="700x340" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Spacing scale (8-pt + 4/12/20)</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<style>
  html, body { margin: 0; padding: 0; }
  body { background: var(--nyan-bg); padding: 24px; }
  .card { width: 100%; }
  .row { display: flex; gap: 12px; align-items: center; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .swatch { width: 56px; height: 56px; border-radius: var(--radius-small); border: 1px solid color-mix(in srgb, var(--nyan-divider) 60%, transparent); }
  .swatch-lg { width: 100%; height: 64px; border-radius: var(--radius-card); border: 1px solid color-mix(in srgb, var(--nyan-divider) 60%, transparent); }
  .token-label { font: var(--fw-medium) var(--fz-meta)/1.2 var(--font-ui); color: var(--nyan-text); }
  .token-meta  { font: var(--fw-regular) 11px/1.3 var(--font-mono); color: var(--nyan-text-secondary); }
  .grid { display: grid; gap: 14px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font: var(--fw-medium) 11px/1 var(--font-mono); background: var(--nyan-surface-muted); color: var(--nyan-text-secondary); border: 1px solid var(--nyan-divider); }
  
</style>
</head>
<body><div class="card">
  <div class="col" style="gap:10px;">
    
      <div class="row" style="gap:14px;">
        <div style="width:16px; height:14px; background:var(--nyan-primary); border-radius:4px;"></div>
        <div class="token-label" style="min-width:64px;">space4</div>
        <div class="token-meta">4px</div>
      </div>
    
      <div class="row" style="gap:14px;">
        <div style="width:32px; height:14px; background:var(--nyan-primary); border-radius:4px;"></div>
        <div class="token-label" style="min-width:64px;">space8</div>
        <div class="token-meta">8px</div>
      </div>
    
      <div class="row" style="gap:14px;">
        <div style="width:48px; height:14px; background:var(--nyan-primary); border-radius:4px;"></div>
        <div class="token-label" style="min-width:64px;">space12</div>
        <div class="token-meta">12px</div>
      </div>
    
      <div class="row" style="gap:14px;">
        <div style="width:64px; height:14px; background:var(--nyan-primary); border-radius:4px;"></div>
        <div class="token-label" style="min-width:64px;">space16</div>
        <div class="token-meta">16px</div>
      </div>
    
      <div class="row" style="gap:14px;">
        <div style="width:80px; height:14px; background:var(--nyan-primary); border-radius:4px;"></div>
        <div class="token-label" style="min-width:64px;">space20</div>
        <div class="token-meta">20px</div>
      </div>
    
      <div class="row" style="gap:14px;">
        <div style="width:96px; height:14px; background:var(--nyan-primary); border-radius:4px;"></div>
        <div class="token-label" style="min-width:64px;">space24</div>
        <div class="token-meta">24px</div>
      </div>
    
      <div class="row" style="gap:14px;">
        <div style="width:128px; height:14px; background:var(--nyan-primary); border-radius:4px;"></div>
        <div class="token-label" style="min-width:64px;">space32</div>
        <div class="token-meta">32px</div>
      </div>
    
    <div class="row" style="gap:14px; margin-top:6px;">
      <div style="width:88px; height:18px; background:var(--nyan-primary-deep); border-radius:4px;"></div>
      <div class="token-label" style="min-width:64px;">minTapTarget</div>
      <div class="token-meta">44px · every tappable thing</div>
    </div>
  </div>
</div></body>
</html>
