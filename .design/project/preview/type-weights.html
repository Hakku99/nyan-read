<!doctype html>
<!-- @dsCard group="Brand" name="Type — weights" subtitle="Only w400 / w500 / w600 allowed" viewport="700x250" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Type weights</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<style>
  html, body { margin: 0; padding: 0; }
  body { background: var(--nyan-bg); padding: 24px; }
  .card { width: 100%; }
  .row { display: flex; gap: 12px; align-items: center; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .swatch { width: 56px; height: 56px; border-radius: var(--radius-small); border: 1px solid color-mix(in srgb, var(--nyan-divider) 60%, transparent); }
  .swatch-lg { width: 100%; height: 64px; border-radius: var(--radius-card); border: 1px solid color-mix(in srgb, var(--nyan-divider) 60%, transparent); }
  .token-label { font: var(--fw-medium) var(--fz-meta)/1.2 var(--font-ui); color: var(--nyan-text); }
  .token-meta  { font: var(--fw-regular) 11px/1.3 var(--font-mono); color: var(--nyan-text-secondary); }
  .grid { display: grid; gap: 14px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font: var(--fw-medium) 11px/1 var(--font-mono); background: var(--nyan-surface-muted); color: var(--nyan-text-secondary); border: 1px solid var(--nyan-divider); }
  
</style>
</head>
<body><div class="card">
  <div class="col" style="gap:16px;">
    <div class="col" style="gap:2px;"><div style="font: 400 22px/1.3 var(--font-ui); color:var(--nyan-text);">Regular 400 — body, hint, caption</div>
      <div class="token-meta">FontWeight.w400 · 90% of all text</div></div>
    <div class="col" style="gap:2px;"><div style="font: 500 22px/1.3 var(--font-ui); color:var(--nyan-text);">Medium 500 — buttons, labels, chips</div>
      <div class="token-meta">FontWeight.w500 · interactive labels</div></div>
    <div class="col" style="gap:2px;"><div style="font: 600 22px/1.3 var(--font-ui); color:var(--nyan-text);">SemiBold 600 — titles, numerics</div>
      <div class="token-meta">FontWeight.w600 · everything above body</div></div>
    <div class="pill"><i class="ph ph-prohibit" style="font-size:14px;"></i> w100–w300 and w700+ are rejected</div>
  </div>
</div></body>
</html>
