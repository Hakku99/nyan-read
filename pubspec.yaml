name: nyan_read
description: A cute, modular e-book reader.
publish_to: 'none'
version: 1.0.0+1

environment:
  # Floor matches actual API usage: Color.withValues / toARGB32 need
  # Dart 3.6+ (Flutter 3.27+); older SDKs fail to compile anyway.
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Core Logic
  get_it: ^9.2.0
  go_router: ^13.2.0
  sqflite: ^2.3.0
  path: ^1.8.3
  shared_preferences: ^2.2.0
  path_provider: ^2.1.5
  
  # Privacy & Utils
  crypto: ^3.0.3
  uuid: ^4.0.0
  intl: ^0.20.2
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.3.0

  # UI / UX
  flutter_animate: ^4.2.0

  # Reader Engines
  # P3c (2026-07): epub_view + epubx dropped — the EPUB stack is fully
  # self-hosted (epub_package_parser.dart + own renderer), which unpinned
  # archive/image from their 3.x prisons.
  image: ^4.5.0
  pdfx: ^2.6.0
  scrollable_positioned_list: ^0.3.8
  fast_gbk: ^1.0.0
  html: ^0.15.0
  archive: ^4.0.0
  # Own EPUB package parsing (container.xml / OPF / NCX / nav).
  xml: ^6.5.0
  
  # File Handling (Stubs for now since we can't fully run)
  file_picker: ^10.3.10
  permission_handler: ^12.0.1
  screen_brightness: ^2.1.0
  url_launcher: ^6.2.6
  share_plus: ^12.0.1
  flutter_riverpod: ^3.3.1
  phosphor_flutter: ^2.1.0
  flutter_svg: ^2.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Bumped with image 4.x (P3c); 0.11 pinned image ^3.
  flutter_launcher_icons: ^0.14.4
  sqflite_common_ffi: ^2.4.0+2

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/splash_screen.png
  android_12:
    image: assets/images/splash_screen.png

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/brand/

  # 本地字体注册（见 assets/fonts/README.md 获取 .ttf / .otf 文件）。
  # 若对应字体文件缺失，Flutter 会在启动时打印 warning 并回落到平台 CJK 默认字体；
  # 运行逻辑不会崩，但 serif 阅读模式不生效，UI 会使用平台字体。
  fonts:
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/subset/NotoSansSC-Regular.ttf
          weight: 400
        - asset: assets/fonts/subset/NotoSansSC-Medium.ttf
          weight: 500
        - asset: assets/fonts/subset/NotoSansSC-SemiBold.ttf
          weight: 600
    - family: Source Han Serif SC
      fonts:
        - asset: assets/fonts/SourceHanSerifSC-Regular.otf
          weight: 400
        - asset: assets/fonts/SourceHanSerifSC-SemiBold.otf
          weight: 600


# Flutter launcher icons configuration is now in flutter_launcher_icons.yaml
