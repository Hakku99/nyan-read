name: nyan_read
description: A cute, modular e-book reader.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  
  # Core Logic
  provider: ^6.0.5
  get_it: ^9.2.0
  sqflite: ^2.3.0
  path: ^1.8.3
  shared_preferences: ^2.2.0
  path_provider: ^2.0.0
  
  # Privacy & Utils
  encrypt: ^5.0.1
  crypto: ^3.0.3
  uuid: ^4.0.0
  intl: ^0.20.2
  flutter_secure_storage: ^9.0.0

  # UI / UX
  google_fonts: ^8.0.0
  flutter_animate: ^4.2.0

  # Reader Engines
  epub_view: ^3.2.0
  pdfx: ^2.6.0
  internet_file: ^1.2.0
  scrollable_positioned_list: ^0.3.8
  fast_gbk: ^1.0.0
  
  # File Handling (Stubs for now since we can't fully run)
  file_picker: ^10.3.10
  permission_handler: ^12.0.1
  screen_brightness: ^1.0.1
  url_launcher: ^6.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: 0.11.0

flutter:
  generate: true
  uses-material-design: true

# Flutter launcher icons configuration is now in flutter_launcher_icons.yaml
