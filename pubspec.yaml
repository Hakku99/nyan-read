name: nyan_read
description: A cute, modular e-book reader.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Core Logic
  provider: ^6.0.5
  get_it: ^7.6.0
  sqflite: ^2.3.0
  path: ^1.8.3
  shared_preferences: ^2.2.0
  
  # Privacy & Utils
  encrypt: ^5.0.1
  crypto: ^3.0.3
  uuid: ^4.0.0
  intl: ^0.18.0

  # UI / UX
  google_fonts: ^6.1.0
  flutter_animate: ^4.2.0
  
  # File Handling (Stubs for now since we can't fully run)
  file_picker: ^8.0.0
  permission_handler: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
